plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.thatsmine'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
}

wrapper {
	gradleVersion = '8.14'
	distributionType = Wrapper.DistributionType.BIN
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 단일 서비스 배포: ./gradlew bootJar -PwithFrontend 로 빌드하면 ../frontend/dist(npm run build 결과)를
// jar 안의 static/ 에 넣어 Spring Boot가 화면까지 함께 제공한다. 소스 폴더는 건드리지 않는다.
if (project.hasProperty('withFrontend')) {
	def frontendDist = file("${projectDir}/../frontend/dist")
	if (!new File(frontendDist, 'index.html').exists()) {
		throw new GradleException('프론트 빌드 결과(frontend/dist/index.html)가 없습니다. 먼저 frontend에서 npm run build를 실행하세요.')
	}
	tasks.named('processResources') {
		from(frontendDist) {
			into 'static'
		}
	}
}
