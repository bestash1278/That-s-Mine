server:
  # 배포 플랫폼이 PORT 환경변수로 포트를 알려 준다(없으면 8080)
  port: ${PORT:8080}
  # 프록시(플랫폼 로드밸런서) 뒤에서 https 주소를 올바르게 인식
  forward-headers-strategy: framework

spring:
  application:
    name: thatsmine
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리한다. Hibernate는 스키마를 만들거나 검증하지 않는다.
      ddl-auto: none
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thatsmine}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8${DB_OPTIONS:}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      # 장당 5MB, 최대 3장 + JSON 파트
      max-file-size: 5MB
      max-request-size: 16MB

file:
  # 업로드 이미지 저장 경로(backend 실행 위치 기준). /uploads/** 로 제공된다.
  upload-dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.thatsmine: DEBUG
  file:
    name: logs/thatsmine.log
    max-size: 10MB
    max-history: 30
