spring:
  jpa:
    hibernate:
      # Flyway가 만든 스키마를 그대로 쓴다. create-drop을 쓰면 Flyway 이력과 실제 테이블이 어긋난다.
      ddl-auto: none
    show-sql: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thatsmine_dev}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

# 개발용 JWT 비밀키(32바이트 이상). 운영에서는 반드시 환경변수 JWT_SECRET으로 다른 값을 쓴다.
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123}

# 개발용 시연 계정 비밀번호. 운영에서는 이 프로필을 쓰지 않으며 계정도 만들지 않는다.
demo:
  account-password: ${DEMO_ACCOUNT_PASSWORD:demo1234!}

logging:
  level:
    root: INFO
    com.thatsmine: DEBUG
    org.hibernate.SQL: DEBUG
