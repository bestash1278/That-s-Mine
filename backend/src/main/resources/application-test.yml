# 테스트 전용 프로필. 테스트 클래스에 @ActiveProfiles("test")를 붙여야 적용된다.
# TODO: src/test/resources로 옮기기(현재는 운영 jar에도 포함됨)
spring:
  jpa:
    hibernate:
      # V1 SQL은 MySQL 전용 구문(ENGINE, ON UPDATE 등)이 있어 H2에서는 Hibernate가 스키마를 만든다.
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

file:
  upload-dir: build/test-uploads

jwt:
  secret: test-only-jwt-secret-for-automated-tests-0123456789
  expiration: 3600000

logging:
  level:
    root: INFO
    com.thatsmine: DEBUG
